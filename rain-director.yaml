substitutions:
  name: "rain-director"
  friendly_name: "Rain Director"
  tank_capacity: "80.0"  # Tank capacity in liters

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "pturner1989.rain-director"  # Update with your GitHub username
    version: "1.0.3"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  actions:
    # Writes operator-supplied bytes to the bus. A lambda rather than
    # uart.write, so bad input can be refused with a warning.
    - action: replay_bytes
      variables:
        hex: string
      then:
        - lambda: |-
            // Checked before the input, so a forgotten switch is named
            // ahead of anything wrong with the bytes.
            if (!id(bus_capture).state) {
              ESP_LOGW("rd.replay", "Replay needs Bus Capture on. Nothing sent.");
              return;
            }
            // The operator may paste a whole log line. Trim the outer
            // whitespace, then drop any log prefix up to and including the
            // last "]: ". Nothing else is stripped: a parser that skipped
            // unrecognised characters would read a timestamp as hex digits
            // and write invented bytes to a bus that drives water valves.
            auto trim = [](std::string &s) {
              const char *ws = " \t\r\n";
              size_t begin = s.find_first_not_of(ws);
              if (begin == std::string::npos) { s.clear(); return; }
              s = s.substr(begin, s.find_last_not_of(ws) - begin + 1);
            };
            std::string input = hex;
            trim(input);
            // Remembered before the prefix strip, so an input that held only a
            // log prefix is not reported as an empty field.
            bool blank_field = input.empty();
            size_t prefix_end = input.rfind("]: ");
            if (prefix_end != std::string::npos) {
              input.erase(0, prefix_end + 3);
              trim(input);
            }
            auto nibble = [](char c) -> int {
              if (c >= '0' && c <= '9') return c - '0';
              if (c >= 'a' && c <= 'f') return c - 'a' + 10;
              if (c >= 'A' && c <= 'F') return c - 'A' + 10;
              return -1;
            };
            auto is_separator = [](char c) -> bool {
              return c == ' ' || c == ':' || c == ',' || c == '-';
            };
            // Every rejection names its own cause, so the warning tells the
            // operator what to fix.
            enum Reason { REASON_NONE, REASON_EMPTY, REASON_CHARACTER,
                          REASON_PAIRS, REASON_LIMIT };
            Reason reason = REASON_NONE;
            std::vector<uint8_t> out;
            size_t i = 0;
            bool first = true;
            while (i < input.size()) {
              // Separators are allowed between pairs but are not required, so a
              // run of hex digits with no separators is accepted. A separator
              // inside a pair still fails as a bad character.
              if (!first) {
                while (i < input.size() && is_separator(input[i])) { i++; }
                if (i >= input.size()) break;
              }
              if (i + 1 >= input.size()) {
                reason = nibble(input[i]) < 0 ? REASON_CHARACTER : REASON_PAIRS;
                break;
              }
              int high = nibble(input[i]);
              int low = nibble(input[i + 1]);
              if (high < 0 || low < 0) { reason = REASON_CHARACTER; break; }
              // Above the capture group size and above any frame the component accepts.
              if (out.size() >= 256) { reason = REASON_LIMIT; break; }
              out.push_back((uint8_t) ((high << 4) | low));
              i += 2;
              first = false;
            }
            if (reason == REASON_NONE && out.empty()) {
              reason = input.empty() ? REASON_EMPTY : REASON_PAIRS;
            }
            // The whole input is refused, so a late fault never leaves a
            // partial sequence on the bus.
            if (reason != REASON_NONE) {
              switch (reason) {
                case REASON_EMPTY:
                  if (blank_field) {
                    ESP_LOGW("rd.replay", "Replay input is empty. Nothing sent.");
                  } else {
                    ESP_LOGW("rd.replay",
                             "Replay input '%s' holds no bytes. Nothing sent.",
                             hex.c_str());
                  }
                  break;
                case REASON_CHARACTER:
                  ESP_LOGW("rd.replay",
                           "Replay input '%s' holds a character that is not a hex digit "
                           "or a separator. Nothing sent.", hex.c_str());
                  break;
                case REASON_LIMIT:
                  // The input is not quoted here. It runs to 770 characters or
                  // more, so the logger would cut the line before the limit
                  // reached the operator.
                  ESP_LOGW("rd.replay",
                           "Replay input is longer than the 256 byte limit. "
                           "Nothing sent.");
                  break;
                default:
                  ESP_LOGW("rd.replay",
                           "Replay input '%s' is not whole hex digit pairs. "
                           "Nothing sent.", hex.c_str());
                  break;
              }
              return;
            }
            id(uart_bus)->write_array(out.data(), out.size());

ota:
  - platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

improv_serial:

external_components:
  - source: github://pturner1989/esphome-rain-director@main
    components: [ rain_director ]
    refresh: 1s

uart:
  id: uart_bus
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  debug:
    direction: BOTH
    # Frames start with a delimiter rather than ending with one, so group
    # bytes on an idle gap with a byte cap instead of on a delimiter.
    after:
      bytes: 150
      timeout: 100ms
    sequence:
      - lambda: |-
          if (!id(bus_capture).state) return;
          std::string hex;
          std::string text;
          char buf[4];
          for (size_t i = 0; i < bytes.size(); i++) {
            if (i != 0) hex += ' ';
            snprintf(buf, sizeof(buf), "%02X", bytes[i]);
            hex += buf;
            // One character per byte, so the text line lines up with the
            // byte pairs on the hex line.
            uint8_t b = bytes[i];
            text += (b >= 0x20 && b <= 0x7E) ? (char) b : '.';
          }
          bool is_rx = direction == esphome::uart::UART_DIRECTION_RX;
          // The hex line comes first: it is the form the replay action takes.
          ESP_LOGI(is_rx ? "rd.rx" : "rd.tx", "%s", hex.c_str());
          // Matches the built-in hex helper: without this pause the logger
          // drops API log lines during bursts of traffic.
          delay(10);
          ESP_LOGI(is_rx ? "rd.rx.text" : "rd.tx.text", "%s", text.c_str());
          delay(10);

rain_director:
  uart_id: uart_bus
  
  tank_level:
    name: "Tank Level"
    id: tank_level   

  mode_code:
    name: "Mode Code"
    entity_category: diagnostic

  state_code:
    name: "State Code"
    entity_category: diagnostic

  mode:
    name: "Mode"
    
  status:
    name: "Status"
    id: tank_status
    
  source:
    name: "Source"
    id: water_source

# Global variables for consumption tracking
globals:
  - id: rainwater_total
    type: float
    restore_value: true
    initial_value: '0.0'
    
  - id: mains_total
    type: float
    restore_value: true
    initial_value: '0.0'
    
  - id: last_level
    type: float
    restore_value: false
    initial_value: '-1.0'

# Track consumption based on level changes while filling
interval:
  - interval: 10s
    then:
      - lambda: |-
          float current_level = id(tank_level).state;
          if (isnan(current_level)) return;
          
          float prev_level = id(last_level);
          
          if (prev_level >= 0 && current_level > prev_level) {
            // Tank is filling - calculate liters added
            float liters_added = (current_level - prev_level) / 100.0 * ${tank_capacity};
            
            // Check source and add to appropriate counter
            std::string source = id(water_source).state;
            if (source == "Rainwater") {
              id(rainwater_total) += liters_added;
              ESP_LOGI("consumption", "Added %.1f L rainwater (total: %.1f L)", liters_added, id(rainwater_total));
            } else if (source == "Mains") {
              id(mains_total) += liters_added;
              ESP_LOGI("consumption", "Added %.1f L mains (total: %.1f L)", liters_added, id(mains_total));
            }
          }
          
          id(last_level) = current_level;

sensor:
    # Tank volume in liters (100L tank)
  - platform: template
    name: "Tank Volume"
    id: tank_volume
    unit_of_measurement: "L"
    accuracy_decimals: 0
    icon: "mdi:water"
    state_class: measurement
    device_class: water
    update_interval: 30s
    lambda: |-
      float level_pct = id(tank_level).state;
      if (isnan(level_pct)) return NAN;
      return (level_pct / 100.0) * ${tank_capacity};
      
  # Rainwater consumption total
  - platform: template
    name: "Rainwater Used"
    id: rainwater_used
    unit_of_measurement: "L"
    accuracy_decimals: 0
    icon: "mdi:water-check"
    state_class: total_increasing
    device_class: water
    update_interval: 60s
    lambda: |-
      return id(rainwater_total);

  # Mains water consumption total
  - platform: template
    name: "Mains Used"
    id: mains_used
    unit_of_measurement: "L"
    accuracy_decimals: 0
    icon: "mdi:water-pump"
    state_class: total_increasing
    device_class: water
    update_interval: 60s
    lambda: |-
      return id(mains_total);
    
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"

switch:
  - platform: template
    name: "Bus Capture"
    id: bus_capture
    icon: "mdi:bug-outline"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    name: "Restart"
    entity_category: config
    
  - platform: template
    name: "Reset Consumption Counters"
    icon: "mdi:counter"
    entity_category: config
    on_press:
      then:
        - globals.set:
            id: rainwater_total
            value: '0.0'
        - globals.set:
            id: mains_total
            value: '0.0'
        - logger.log: "Consumption counters reset"
